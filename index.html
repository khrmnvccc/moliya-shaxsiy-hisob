<script>

const PM=['Naqd','Karta','Bank','Dollar','Boshqa'],COL=['#0b6b4f','#ef6a5b','#f59e0b','#38a685','#5b6b7f','#c2410c','#94a3b8','#14532d','#fb923c','#0f766e','#9ca3af','#b91c1c'];

let S={tx:[],debts:[],cats:[],rate:12500,init:0,name:'',theme:''},accountReady=false,cloudQueue=Promise.resolve(),AUTH=null,TG_LINKED=false;
function storeSession(){if(!AUTH)return;const raw=JSON.stringify(AUTH);if(AUTH.remember){try{localStorage.setItem('moliya_session',raw);sessionStorage.removeItem('moliya_session')}catch{try{sessionStorage.setItem('moliya_session',raw)}catch{}}}else{try{sessionStorage.setItem('moliya_session',raw);localStorage.removeItem('moliya_session')}catch{}}}

async function refreshAuth(){if(!AUTH?.refresh_token)throw Error('Sessiya tugadi. Qayta kiring.');const r=await fetch(SUPABASE_URL+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{'Content-Type':'application/json','apikey':SUPABASE_PUBLISHABLE_KEY},body:JSON.stringify({refresh_token:AUTH.refresh_token})});const d=await r.json();if(!r.ok)throw Error('Sessiya tugadi. Qayta kiring.');AUTH={...d,username:AUTH.username,remember:AUTH.remember===true};storeSession()}

const sum=a=>a.reduce((s,x)=>s+x,0),by=(l,t)=>sum(l.filter(x=>x.type==t).map(x=>x.amt));
const inM=m=>S.tx.filter(x=>x.date.startsWith(m));

function stats(m){const l=inM(m),inc=by(l,'in'),exp=by(l,'out');const g={};l.filter(x=>x.type=='out').forEach(x=>g[x.cat]=(g[x.cat]||0)+x.amt);
const s={};l.filter(x=>x.type=='in').forEach(x=>s[x.cat]=(s[x.cat]||0)+x.amt);
const top=o=>Object.entries(o).sort((a,b)=>b[1]-a[1])[0];
return{l,inc,exp,net:inc-exp,g,topC:top(g),topS:top(s),big:l.filter(x=>x.type=='out').sort((a,b)=>b.amt-a.amt)[0]}}

function donut(g){const e=Object.entries(g).sort((a,b)=>b[1]-a[1]),t=sum(e.map(x=>x[1]));if(!t)return Empty('pie-chart',"Bu oy hali xarajat kiritilmagan.","Birinchi xarajatingizni qo'shing.",`<button class="btn s" onclick="txForm(undefined,'out')">Xarajat qo'shish</button>`);
let o=0;const R=42,C=2*Math.PI*R,arcs=e.map((x,i)=>{const q=x[1]/t,a=`<circle r="${R}" cx="60" cy="60" fill="none" stroke="${COL[i%COL.length]}" stroke-width="14" stroke-dasharray="${Math.max(q*C-2,.5)} ${C}" stroke-dashoffset="${-o*C}" transform="rotate(-90 60 60)"/>`;o+=q;return a}).join('');
return `<div class="dn"><svg viewBox="0 0 120 120" class="donut2" role="img" aria-label="Xarajatlar diagrammasi">${arcs}<text x="60" y="57" text-anchor="middle" font-size="8" fill="var(--mu)">Jami</text><text x="60" y="71" text-anchor="middle" font-size="11" font-weight="700" fill="var(--tx)">${mln(t).replace(" so'm","")}</text></svg><div class="lg2">${e.slice(0,6).map((x,i)=>`<div><i class="dot" style="background:${COL[i%COL.length]}"></i><span>${esc(x[0])}</span><b>${Math.round(x[1]/t*100)}%</b><em>${fmt(x[1])}</em></div>`).join('')}</div></div>`}
const num=n=>fmt(n).replace(" so'm","");
const CI={Tovar:'shopping-bag',Taksi:'car',Ovqat:'utensils',Uy:'home',Telefon:'smartphone',Mashina:'car',Paket:'package',Oila:'users',Biznes:'briefcase',Kommunal:'receipt',Kredit:'credit-card','Ish haqi':'wallet',Savdo:'store',Xizmat:'wrench',Mijoz:'user-check',Qarz:'hand-coins'};
const ic=(n,c='')=>`<i data-lucide="${n}" class="ic ${c}"></i>`;
const catIcon=(c,t)=>CI[Object.keys(CI).find(k=>c.includes(k))]||(t=='in'?'arrow-down-left':'arrow-up-right');
const pm=m=>{const[y,x]=m.split('-');return x=='01'?(+y-1)+'-12':y+'-'+String(x-1).padStart(2,'0')};
const pct=(a,b)=>b?Math.round((a-b)/Math.abs(b)*100):(a?100:0);
const Sec=(t,a='')=>`<div class="sec"><h2>${esc(t)}</h2>${a}</div>`;
const Empty=(i,t,s,b='')=>`<div class="empty">${ic(i)}<b>${t}</b><span>${s}</span>${b}</div>`;
function sm(p){if(p.length<2)return 'M0 15';let d=`M${p[0][0]} ${p[0][1]}`;for(let i=0;i<p.length-1;i++){const a=p[i],b=p[i+1],c=(a[0]+b[0])/2;d+=`C${c} ${a[1]} ${c} ${b[1]} ${b[0]} ${b[1]}`}return d}
function day(l,f){const n=new Date(+M.slice(0,4),+M.slice(5),0).getDate(),v=Array(n).fill(0);l.forEach(x=>v[+x.date.slice(8)-1]+=f(x));let c=0;return v.map(a=>c+=a)}
function spk(v,col){const hi=Math.max(...v,0),lo=Math.min(...v,0),r=(hi-lo)||1,n=v.length;return `<svg class="spk" viewBox="0 0 100 30" preserveAspectRatio="none" aria-hidden="true"><path class="ln" pathLength="1" d="${sm(v.map((y,i)=>[i/(n-1||1)*100,27-(y-lo)/r*24]))}" stroke="${col}" style="stroke-width:2;vector-effect:non-scaling-stroke"/></svg>`}
const Stat=(icon,lab,val,cur,prev,col,sp,good,note)=>{const d=pct(cur,prev),up=d>=0;return `<div class="stat"><div class="sh"><span class="chip" style="--k:${col}">${ic(icon)}</span><span class="tr2 ${up==!!good?'ok':'bad'}">${ic(up?'trending-up':'trending-down')}${Math.abs(d)}%</span></div><div class="sl">${lab}</div><div class="sv"><span data-n="${val}">${num(val)}</span></div>${spk(sp,col)}<div class="sn">${note}</div></div>`};
function chart(){const y=M.slice(0,4),d=[];for(let i=1;i<=12;i++){const s=stats(y+'-'+String(i).padStart(2,'0'));d.push([s.inc,s.exp])}
const mx=Math.max(1,...d.flat()),X=i=>18+i*29.5,Y=v=>112-v/mx*92,P=k=>sm(d.map((v,i)=>[X(i),Y(v[k])])),c=stats(M);
return `<div class="chart"><div class="tip"><span class="mu">${MN[+M.slice(5)-1]}</span><b class="in">▲ ${mln(c.inc)}</b><b class="out">▼ ${mln(c.exp)}</b></div><svg viewBox="0 0 380 140" width="100%"><defs><linearGradient id="gi" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--in)" stop-opacity=".22"/><stop offset="1" stop-color="var(--in)" stop-opacity="0"/></linearGradient></defs>
<path d="${P(0)} L${X(11)} 112 L${X(0)} 112Z" fill="url(#gi)"/><path class="ln" pathLength="1" d="${P(0)}" stroke="var(--in)"/><path class="ln" pathLength="1" d="${P(1)}" stroke="var(--out)"/>
${d.map((v,i)=>{const mm=y+'-'+String(i+1).padStart(2,'0'),a=mm==M;return `<g onclick="M='${mm}';render()" style="cursor:pointer"><rect x="${X(i)-14}" y="2" width="28" height="122" rx="10" fill="${a?'var(--ac)':'transparent'}" opacity="${a?.09:1}"/>${a?`<circle cx="${X(i)}" cy="${Y(v[0])}" r="4" fill="var(--in)"/><circle cx="${X(i)}" cy="${Y(v[1])}" r="4" fill="var(--out)"/>`:''}<text class="${a?'sel':''}" x="${X(i)}" y="134" text-anchor="middle">${MN[i].slice(0,3)}</text></g>`}).join('')}</svg></div>`}
function smart(s){const P=[];P.push(`Bu oy daromadingiz <b>${mln(s.inc)}</b> bo'ldi.`,`Xarajatlaringiz <b>${mln(s.exp)}</b>.`,`Sizda <b class="${s.net<0?'out':'in'}">${mln(s.net)}</b> sof qoldiq mavjud.`);
if(s.topC)P.push(`Eng katta xarajatingiz — ${esc(s.topC[0])}: <b>${mln(s.topC[1])}</b>.`);
P.push(`Boshqalarga bergan qarzingiz: <b>${mln(sum(given().map(rem)))}</b>.`,`Boshqalardan olgan qarzingiz: <b>${mln(sum(taken().map(rem)))}</b>.`);return P.map(x=>`<p>${x}</p>`).join('')}
async function refreshDollarRate(manual=false){const status=$('#rateStatus');if(status)status.textContent='Rasmiy kurs tekshirilmoqda…';try{const r=await fetch('https://cbu.uz/uz/arkhiv-kursov-valyut/json/USD/',{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const data=await r.json(),usd=Array.isArray(data)?data[0]:data;if(!usd||!Number.isFinite(Number(usd.Rate)))throw Error('Kurs topilmadi');const rate=Number(String(usd.Rate).replace(',','.'));if(rate>0){S.rate=rate;S.rateUpdated=usd.Date||today();save();if(V==='home')render();else if(status)status.textContent='Yangilangan sana: '+S.rateUpdated+' · $100 = '+fmt(100*S.rate)}}catch(e){if(status)status.textContent='Kursni hozircha olib bo‘lmadi · saqlangan kurs: '+fmt(S.rate);if(manual)toast('Markaziy bank kursiga ulanib bo‘lmadi. Keyinroq qayta urinib ko‘ring.') }}
function home(){const s=stats(M),p=stats(pm(M)),gv=sum(given().map(rem)),tk=sum(taken().map(rem)),bal=balance(),
rp=given().flatMap(d=>d.pays.filter(x=>x.d.startsWith(M)).map(x=>({date:x.d,a:x.a}))),gp=sum(rp.map(x=>x.a)),gn=sum(given().filter(d=>d.date.startsWith(M)).map(d=>d.amt)),
rec=s.l.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5),dt=S.tx.filter(x=>x.date==D),di=by(dt,'in'),dx=by(dt,'out'),
mini=(d,t)=>{const r=rem(d),q=Math.round((d.amt-r)/d.amt*100);return `<div class="dm"><div class="row sp"><b class="uc">${esc(d.name)}</b><b>${fmt(r)}</b></div><div class="mu">${t}</div><div class="bar"><i style="width:${q}%"></i></div><div class="row sp mu"><span>Qaytarilgan: ${num(d.amt-r)}</span><b>${q}%</b></div></div>`},
dl=given().filter(d=>rem(d)>0).slice(0,3).map(d=>mini(d,'Sizga qaytarishi kerak')).concat(taken().filter(d=>rem(d)>0).slice(0,3).map(d=>mini(d,'Sizning qarzingiz')));
const inn=s.l.filter(x=>x.type=='in'),out=s.l.filter(x=>x.type=='out');
return head()+`<section class="bal-card"><div class="bl">Hozirgi balans</div><div class="bv"><span data-n="${bal}">${num(bal)}</span><small>so'm</small></div><div class="bf"><div><span class="bi">${ic('arrow-up-right')}</span><span><em>Daromad</em><b>${num(s.inc)}</b></span></div><div><span class="bi">${ic('arrow-down-left')}</span><span><em>Xarajat</em><b>${num(s.exp)}</b></span></div></div></section>
${Sec('Tezkor amal')}<div class="qa">${[['arrow-down-left','Daromad',"txForm(undefined,'in')",'in'],['arrow-up-right','Xarajat',"txForm(undefined,'out')",'out'],['hand-coins','Qarz berdim',"debtForm('g')",'wn'],['credit-card','Qarz oldim',"debtForm('t')",'wn']].map(a=>`<button class="q ${a[3]}" onclick="${a[2]}">${ic(a[0])}<span>${a[1]}</span></button>`).join('')}</div>
<div class="stats">${Stat('trending-up','Daromad',s.inc,s.inc,p.inc,'var(--in)',day(inn,x=>x.amt),1,'Bu oy tushum')}${Stat('trending-down','Xarajat',s.exp,s.exp,p.exp,'var(--out)',day(out,x=>x.amt),0,'Bu oy sarf')}${Stat('piggy-bank','Sof qoldiq',s.net,s.net,p.net,'var(--ac)',day(s.l,x=>x.type=='in'?x.amt:-x.amt),1,'Daromad − xarajat')}${Stat('handshake','Berilgan qarz',gv,gv,gv+gp-gn,'var(--warn)',day(rp,x=>x.a),0,'Sizga qaytishi kerak')}</div>
<div class="cols"><div>${Sec('Daromad vs Xarajat',`<span class="mu">${M.slice(0,4)}</span>`)}<div class="card">${chart()}</div></div><div>${Sec('Xarajat kategoriyalari')}<div class="card">${donut(s.g)}</div></div></div>
<div class="cols"><div>${Sec('Oxirgi operatsiyalar',`<button class="btn g s" style="flex:none" onclick="V='tx';render()">Barchasi</button>`)}<div class="card">${rec.map(row).join('')||Empty('receipt',"Bu oy hali operatsiya yo'q","Birinchi operatsiyangizni qo'shing.")}</div></div>

<div class="cols"><div>${Sec('Smart hisobot')}<div class="card smart">${smart(s)}</div></div><div>${Sec('Kunlik hisob')}<div class="card"><input type="date" aria-label="Sana" value="${D}" onchange="D=this.value||D;render()"><div class="grid"><div class="st"><span class="mu">Kirdi</span><b class="in">${fmt(di)}</b></div><div class="st"><span class="mu">Chiqdi</span><b class="out">${fmt(dx)}</b></div></div><div class="st" style="margin-top:10px"><span class="mu">Qoldi</span><b>${fmt(di-dx)}</b></div></div>${Sec('Dollar kursi')}<div class="card"><div class="row sp"><label>Markaziy bank USD kursi</label><button class="btn g s" style="flex:none" onclick="refreshDollarRate(true)">Yangilash</button></div><div class="rate-value">1 USD = ${fmt(S.rate)}</div><span class="mu" id="rateStatus">${S.rateUpdated?'Yangilangan sana: '+esc(S.rateUpdated):'Rasmiy kurs olinmoqda…'} · $100 = ${fmt(100*S.rate)}</span></div></div></div>`}

function txv(){let l=F.d?S.tx.filter(x=>x.date==F.d):inM(M);const q=F.q.toLowerCase();
l=l.filter(x=>(!F.t||x.type==F.t)&&(!F.c||x.cat==F.c)&&(!F.m||x.method==F.m)&&(!q||(x.note+x.cat+x.method+x.amt+x.date+dm(x.date)).toLowerCase().includes(q))).sort((a,b)=>b.date.localeCompare(a.date));

async function excelReport(){try{if(!window.XLSX){await new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';s.onload=resolve;s.onerror=reject;document.head.appendChild(s)})}const s=stats(M),rows=reportRows(),sheet=[['MOLIYA HISOBOTI',MN[+M.slice(5)-1]+' '+M.slice(0,4)],['Foydalanuvchi',S.name||'Foydalanuvchi'],['Jami daromad',s.inc],['Jami xarajat',s.exp],['Sof qoldiq',s.net],[],['Sana','Turi','Kategoriya','Izoh',"To'lov usuli",'Asl summa','Valyuta','Kurs (UZS/USD)','Summa (UZS)'],...rows.map(x=>[dm(x.date),x.type=='in'?'Daromad':'Xarajat',x.cat,x.note||'',x.method||'',x.usd||x.amt,x.usd?'USD':'UZS',x.usd?(x.rate||S.rate):1,x.amt])];const ws=XLSX.utils.aoa_to_sheet(sheet);ws['!cols']=[{wch:14},{wch:14},{wch:24},{wch:34},{wch:18},{wch:16},{wch:12},{wch:19},{wch:18}];const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Hisobot');XLSX.writeFile(wb,'moliya-hisobot-'+M+'.xlsx');toast('Tartibli Excel hisoboti yuklandi ✓')}catch(e){dl('moliya-hisobot-'+M+'.csv',csv(),'text/csv;charset=utf-8');toast('Excel moduli ochilmadi, CSV fayl yuklandi') }}
function pdfReport(){const w=window.open('','_blank');if(!w)return alert('PDF oynasi ochilmadi. Brauzerda pop-upga ruxsat bering.');const s=stats(M),rows=reportRows(),body=rows.map(x=>`<tr><td>${esc(dm(x.date))}</td><td>${x.type=='in'?'Daromad':'Xarajat'}</td><td>${esc(x.cat)}</td><td>${esc(x.note||'—')}</td><td>${esc(x.method||'—')}</td><td class="num ${x.type=='in'?'in':'out'}">${x.type=='in'?'+':'−'}${esc(fmt(x.amt))}</td></tr>`).join('');w.document.write(`<!doctype html><html lang="uz"><meta charset="utf-8"><title>Moliya hisoboti ${M}</title><style>body{font:14px Arial,sans-serif;color:#17231d;margin:32px}h1{margin:0 0 6px;color:#0b6b4f}.muted{color:#64736b}.totals{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:22px 0}.box{padding:14px;border:1px solid #dce5df;border-radius:10px}.box b{display:block;margin-top:8px;font-size:18px}table{border-collapse:collapse;width:100%;font-size:12px}th,td{padding:9px 7px;border-bottom:1px solid #dce5df;text-align:left;vertical-align:top}th{background:#edf4ef}.num{text-align:right;white-space:nowrap}.in{color:#12804d}.out{color:#cf493c}.foot{margin-top:20px;color:#64736b;font-size:11px}@media print{body{margin:12mm}.box{break-inside:avoid}thead{display:table-header-group}tr{break-inside:avoid}}</style><h1>Moliya hisoboti</h1><div class="muted">${esc(S.name||'Foydalanuvchi')} · ${esc(MN[+M.slice(5)-1])} ${M.slice(0,4)} · ${esc(dm(today()))}</div><section class="totals"><div class="box">Jami daromad<b class="in">${esc(fmt(s.inc))}</b></div><div class="box">Jami xarajat<b class="out">${esc(fmt(s.exp))}</b></div><div class="box">Sof qoldiq<b>${esc(fmt(s.net))}</b></div></section><table><thead><tr><th>Sana</th><th>Turi</th><th>Kategoriya</th><th>Izoh</th><th>To‘lov usuli</th><th class="num">Summa</th></tr></thead><tbody>${body||'<tr><td colspan="6">Bu oyda yozuv yo‘q</td></tr>'}</tbody></table><p class="foot">Kurs: O‘zbekiston Markaziy banki rasmiy kursi. Chop etish oynasida “PDF sifatida saqlash”ni tanlang.</p><script>window.onload=()=>window.print()<\/script></html>`);w.document.close()}

function txForm(id,type){const x=S.tx.find(t=>t.id==id)||{type:type||'out',date:D,amt:'',cat:'',note:'',method:'Naqd'};window._t=x.type;

<label>Summa</label><div class="row"><input id="fa" type="number" inputmode="decimal" value="${x.usd||x.amt}" style="flex:2"><select id="fc"><option>UZS</option><option ${x.usd?'selected':''}>USD</option></select></div>

function prt(s){return `<h2>Moliyaviy hisobot — ${esc(S.name||'Foydalanuvchi')}</h2><p>Davr: ${MN[+M.slice(5)-1]} ${M.slice(0,4)} · Sana: ${dm(today())}</p><table style="width:100%;border-collapse:collapse;font-size:12px">${s.l.sort((a,b)=>a.date.localeCompare(b.date)).map(x=>`<tr><td>${dm(x.date)}</td><td>${x.type=='in'?'Daromad':'Xarajat'}</td><td>${esc(x.cat)}</td><td>${esc(x.note)}</td><td style="text-align:right">${x.type=='in'?'+':'-'}${fmt(x.amt)}</td></tr>`).join('')}</table>`}
function settings(){const U=S.cats.map((c,i)=>`<div class="row sp"><span>${esc(c)}</span><button class="btn s r" style="flex:none" aria-label="Kategoriyani o'chirish" onclick="ask('Kategoriya olib tashlansinmi?',()=>{S.cats.splice(${i},1);save();$('#dlg').close();render()})">${ic('trash-2')}</button></div>`).join('')||'<p class="mu">Qo\'shimcha kategoriya yo\'q</p>';
return head()+`<h2>Sozlamalar</h2><div class="card"><label for="sn">Ism</label><input id="sn" value="${esc(S.name)}" onchange="S.name=this.value;save()"><label>Avtomatik dollar kursi</label><div class="row"><input value="1 USD = ${fmt(S.rate)}" readonly><button class="btn g s" style="flex:none" onclick="refreshDollarRate(true)">Yangilash</button></div><p class="mu">${S.rateUpdated?'Rasmiy kurs sanasi: '+esc(S.rateUpdated):'Kurs Markaziy bankdan avtomatik olinadi.'}</p><label for="si">Boshlang'ich balans (so'm)</label><input id="si" type="number" inputmode="decimal" value="${S.init}" onchange="S.init=+this.value||0;save()"><label for="sm">Mavzu</label><select id="sm" onchange="S.theme=this.value;document.documentElement.dataset.theme=this.value;save()">${[['','Avto'],['light',"Yorug'"],['dark',"Qorong'i"]].map(o=>`<option value="${o[0]}" ${S.theme==o[0]?'selected':''}>${o[1]}</option>`).join('')}</select><label for="sd">Sana formati</label><select id="sd" onchange="S.df=this.value;save();render()">${[['dmy','20.09.2026'],['iso','2026-09-20'],['mdy','09/20/2026']].map(o=>`<option value="${o[0]}" ${(S.df||'dmy')==o[0]?'selected':''}>${o[1]}</option>`).join('')}</select><label for="sf">Raqam formati</label><select id="sf" onchange="S.nf=this.value;save();render()">${[['space','1 000 000'],['comma','1,000,000'],['dot','1.000.000']].map(o=>`<option value="${o[0]}" ${(S.nf||'space')==o[0]?'selected':''}>${o[1]}</option>`).join('')}</select><p class="mu">Asosiy valyuta: UZS. Eski yozuvlar o'z kursini saqlaydi.</p></div><h2>Kategoriyalar</h2><div class="card">${U}<div class="row"><input id="nc" aria-label="Yangi kategoriya" placeholder="Yangi kategoriya"><button class="btn" style="flex:none" onclick="const v=$('#nc').value.trim();if(v&&!cats().includes(v)){S.cats.push(v);save();render()}">Qo'shish</button></div></div><h2>Ma'lumotlar</h2><div class="card row"><button class="btn" onclick="backup()">${ic('download')} Zaxira (JSON)</button><button class="btn g" onclick="restore()">${ic('upload')} Tiklash</button></div><p class="mu">Ma’lumotlar sizga berilgan login akkauntida alohida saqlanadi.</p>`}
function backup(){const t=JSON.stringify(S,null,1);dl('moliya-zaxira.json',t,'application/json');open_(`<h3>Zaxira</h3><textarea id="bk" rows="9" readonly aria-label="Zaxira JSON">${esc(t)}</textarea><div class="row"><button class="btn" onclick="$('#bk').select();document.execCommand('copy')">Nusxalash</button><button class="btn g" onclick="$('#dlg').close()">Yopish</button></div>`)}
function restore(){open_(`<h3>Tiklash</h3><p class="mu">Zaxira JSON matnini qo'ying. Joriy ma'lumotlar tasdiqsiz almashtirilmaydi.</p><textarea id="rs" rows="9" aria-label="Zaxira JSON"></textarea><div class="row"><button class="btn g" onclick="$('#dlg').close()">Bekor</button><button class="btn" onclick="doRestore()">Tekshirish</button></div>`)}
function doRestore(){let d;try{d=JSON.parse($('#rs').value)}catch(e){return alert("JSON format noto'g'ri")}
const safeId=x=>typeof x==='string'&&/^[A-Za-z0-9_-]{1,64}$/.test(x),safeDate=x=>typeof x==='string'&&/^\d{4}-\d\d-\d\d$/.test(x)&&Number.isFinite(Date.parse(x+'T00:00:00Z'))&&new Date(x+'T00:00:00Z').toISOString().slice(0,10)===x,safeText=x=>typeof x==='string'&&x.length<=500,finite=(x,min=0)=>typeof x==='number'&&Number.isFinite(x)&&x>=min;
const ok=d&&Array.isArray(d.tx)&&Array.isArray(d.debts)&&Array.isArray(d.cats)&&d.cats.length<=100&&d.cats.every(safeText)&&d.tx.length<=10000&&d.debts.length<=10000&&d.tx.every(x=>x&&safeId(x.id)&&['in','out'].includes(x.type)&&finite(x.amt,0.01)&&safeDate(x.date)&&safeText(x.cat)&&safeText(x.note||'')&&PM.includes(x.method)&&(!('usd'in x)||finite(x.usd))&&(!('rate'in x)||finite(x.rate,0.01)))&&d.debts.every(x=>x&&safeId(x.id)&&['g','t'].includes(x.kind)&&safeText(x.name)&&finite(x.amt,0.01)&&safeDate(x.date)&&(!x.due||safeDate(x.due))&&safeText(x.note||'')&&Array.isArray(x.pays)&&x.pays.every(p=>p&&finite(p.a,0.01)&&safeDate(p.d))&&sum(x.pays.map(p=>p.a))<=x.amt);
if(!ok)return alert("Ma'lumotlar tuzilishi noto'g'ri, tiklanmadi");
ask(`Joriy ma'lumotlar (${S.tx.length} tranzaksiya) zaxira bilan (${d.tx.length}) almashtiriladi. Davom etamizmi?`,()=>{S=Object.assign({rate:12500,init:0,name:'',theme:''},d);save();render()})}
const dark=()=>S.theme?S.theme=='dark':matchMedia('(prefers-color-scheme: dark)').matches;
function theme(t){S.theme=t;document.documentElement.dataset.theme=t;save();render()}
function mv(d){const[y,m]=M.split('-').map(Number),t=new Date(y,m-1+d,1);M=t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0');render()}
function more(){const B=(i,t,a)=>`<button onclick="${a}">${ic(i)}<span>${t}</span>${ic('chevron-right')}</button>`;return head()+Sec("Ko'proq")+`<div class="card menu">${B('receipt','Tranzaksiyalar tarixi',"V='tx';render()")}${B('settings','Sozlamalar',"V='set';render()")}${B('download','Zaxira (JSON)','backup()')}${B('log-out','Hisobdan chiqish','logout()')}</div><div class="card"><div class="mu" style="margin-bottom:8px">Mavzu</div><div class="seg"><button class="${dark()?'':'on'}" onclick="theme('light')">${ic('sun')} Light</button><button class="${dark()?'on':''}" onclick="theme('dark')">${ic('moon')} Dark</button></div></div>`}
function fx(){if(window.lucide)lucide.createIcons();document.querySelectorAll('[data-n]').forEach(e=>{const n=+e.dataset.n,t0=performance.now();(function f(t){const k=Math.min(1,(t-t0)/700);e.textContent=num(n*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(f)})(t0)})}
function render(keep){const f={home,tx:txv,debts,rep,set:settings,more}[V];if(keep&&V=='tx'){const h=f();const t=document.createElement('div');t.innerHTML=h;$('#lst').innerHTML=t.querySelector('#lst').innerHTML}else{$('#app').innerHTML=f();$('#app').classList.remove('pg');void $('#app').offsetWidth;$('#app').classList.add('pg')}
document.querySelectorAll('nav [data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v==V||(b.dataset.v=='more'&&(V=='tx'||V=='set'))));lab();fx()}
document.querySelectorAll('nav [data-v]').forEach(b=>b.onclick=()=>{V=b.dataset.v;render();scrollTo(0,0)});
if(TG)TG.ready();
function loginScreen(message=''){accountReady=false;document.querySelector('nav').hidden=true;$('#app').innerHTML='<section class="card auth-card"><div class="auth-brand"><span class="auth-mark"><i data-lucide="wallet" class="ic"></i></span><span>MOLIYA · SHAXSIY HISOB</span></div><div class="auth-kicker">Obunachilar uchun</div><h2>Hisobingizga kiring</h2><p class="auth-sub">Davom etish uchun sizga berilgan login va parolni kiriting.</p>'+(location.protocol==='file:'?'<p class="auth-error" role="alert">Bu kompyuterdagi fayl nusxasi. Serverga ulanish uchun saytni GitHub Pages manzilidan oching: https://khrmnvccc.github.io/asliddin/</p>':'')+(message?'<p class="auth-error" role="alert">'+esc(message)+'</p>':'')+'<form onsubmit="login(event)"><label for="loginUser">Login</label><input id="loginUser" name="username" autocomplete="username" autocapitalize="none" required minlength="3" maxlength="32" pattern="[A-Za-z0-9_-]+" placeholder="Masalan: ali_01"><label for="loginPass">Parol</label><input id="loginPass" name="password" type="password" autocomplete="current-password" required placeholder="Parolingiz"><label class="remember-row" for="rememberMe"><input id="rememberMe" type="checkbox"><span>Eslab qolish — shu qurilmada</span></label><button class="btn" type="submit">Kirish <i data-lucide="arrow-right" class="ic"></i></button></form><div class="auth-contact"><span>To‘lov qilmagan bo‘lsangiz yoki parolni tiklash kerak bo‘lsa, yozing:</span><a href="https://t.me/khrmnvccc" target="_blank" rel="noopener noreferrer">Telegram’da yozish <i data-lucide="arrow-up-right" class="ic"></i></a><b>@khrmnvccc</b></div></section>';if(window.lucide)lucide.createIcons()}
async function login(e){e.preventDefault();if(location.protocol==='file:'){loginScreen('Saytni GitHub Pages manzilidan oching: https://khrmnvccc.github.io/asliddin/');return}const username=$('#loginUser').value.trim().toLowerCase(),password=$('#loginPass').value,btn=e.submitter;btn.disabled=true;btn.textContent='Tekshirilmoqda…';try{const r=await fetch(SUPABASE_URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{'Content-Type':'application/json','apikey':SUPABASE_PUBLISHABLE_KEY},body:JSON.stringify({email:username+'@'+LOGIN_DOMAIN,password})});const d=await r.json();if(!r.ok)throw Error('Login yoki parol noto‘g‘ri. Akkauntni faqat admin ochadi.');AUTH={...d,username,remember:$('#rememberMe').checked};storeSession();await openAccount(username)}catch(err){const expiredPlan=/obuna muddati tugagan/i.test(err.message||'');if(!expiredPlan){AUTH=null;clearSession()}loginScreen(err.message==='Failed to fetch'?'Serverga ulanib bo‘lmadi. Saytni GitHub Pages manzilidan ochganingizni va internetni tekshiring.':err.message)}finally{if(btn.isConnected){btn.disabled=false;btn.textContent='Kirish'}}}
async function openAccount(username){const d=await cloudCall('load');S=Object.assign({tx:[],debts:[],cats:[],rate:12500,init:0,name:username,theme:''},d.state||{});TG_LINKED=!!d.telegramLinked;if(!S.name)S.name=username;if(S.theme)document.documentElement.dataset.theme=S.theme;accountReady=true;document.querySelector('nav').hidden=false;V='home';render();if(!S.rateUpdated||S.rateUpdated!==today())refreshDollarRate()}
function logout(){AUTH=null;accountReady=false;clearSession();document.documentElement.dataset.theme='';S={tx:[],debts:[],cats:[],rate:12500,init:0,name:'',theme:''};V='home';loginScreen('Hisobdan chiqdingiz.')}
async function startApp(){const saved=readSession();if(saved){try{await openAccount(saved.username||'')}catch(err){accountReady=false;const expired=/sessiya tugadi|qayta kiring/i.test(err.message||'');if(/obuna muddati tugagan/i.test(err.message||'')){loginScreen(err.message)}else if(expired){AUTH=null;clearSession();loginScreen('Sessiya muddati tugadi. Login va parolingiz bilan kiring.')}else loginScreen('Internet yoki serverga ulanishda muammo. Saqlangan kirishingiz o‘chmadi; internetni tekshirib sahifani qayta oching.')}}else loginScreen()}
startApp();setInterval(()=>{if(accountReady)refreshDollarRate()},24*60*60*1000);
</script></body></html>
